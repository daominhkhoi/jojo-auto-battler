<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Champion Stats Manager - Auto Battler</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ecf0f1;
            padding: 20px;
            color: #2c3e50;
        }

        h1 {
            text-align: center;
            color: #34495e;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 24px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

            button:hover {
                background-color: #2ecc71;
                box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #34495e;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
            position: sticky;
            top: 0;
        }

        td {
            font-size: 15px;
        }

        tr:hover {
            background-color: #f1c40f;
            color: #000;
            font-weight: bold;
        }

        .cost-1 {
            color: #bdc3c7;
            font-weight: bold;
        }

        .cost-2 {
            color: #2ecc71;
            font-weight: bold;
        }

        .cost-3 {
            color: #3498db;
            font-weight: bold;
        }

        .cost-4 {
            color: #9b59b6;
            font-weight: bold;
        }

        .cost-5 {
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 1px 1px 1px #000;
        }
    </style>
</head>
<body>

    <h1>📊 CHAMPION STATS MANAGEMENT</h1>

    <div class="controls">
        <div style="display: flex; align-items: center;">
            <strong>Total Champions:</strong> <span id="totalChamps" style="color: #e74c3c; font-size: 18px; font-weight: bold; margin-left: 6px;">0</span>
            <span id="syncStatus" style="margin-left: 20px; font-size: 14px; color: #27ae60; font-weight: 600;"></span>
        </div>
        <div>
            <button id="syncDriveBtn" style="background-color: #2980b9; margin-right: 10px;">🔄 ĐỒNG BỘ GOOGLE DRIVE</button>
            <button id="exportBtn">📥 EXPORT EXCEL (.CSV)</button>
        </div>
    </div>

    <table id="champTable">
        <thead>
            <tr>
                <th>Champion Name</th>
                <th>Cost</th>
                <th>HP</th>
                <th>Attack (ATK)</th>
                <th>Range</th>
                <th>Speed</th>
                <th>Mana</th>
                <th>Traits</th>
                <th>Skill Type</th>
                <th>Skill Value</th>
                <th>Radius</th>
                <th>Duration (s)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dữ liệu sẽ được điền tự động bằng JS -->
        </tbody>
    </table>

    <script type="module">
        import { CHAMPION_POOL } from './js/entities.js';

        let currentPool = [...CHAMPION_POOL];
        const tbody = document.querySelector('#champTable tbody');
        const syncStatus = document.getElementById('syncStatus');

        function renderTable(pool) {
            tbody.innerHTML = '';
            document.getElementById('totalChamps').innerText = pool.length;

            pool.forEach(champ => {
                const tr = document.createElement('tr');
                const skill = champ.skill || {};

                let skillPowerDisplay = '';
                if (skill.power) skillPowerDisplay = skill.power.toLocaleString();
                else if (skill.percent) skillPowerDisplay = `${Math.round(skill.percent * 100)}%`;
                else if (skill.radius) skillPowerDisplay = `Radius: ${skill.radius}`;

                tr.innerHTML = `
                    <td style="text-align: left; font-weight: bold;">${champ.name}</td>
                    <td class="cost-${champ.cost}">${champ.cost} 🪙</td>
                    <td>${(champ.hp || 0).toLocaleString()}</td>
                    <td>${(champ.attack || 0).toLocaleString()}</td>
                    <td>${champ.attack_range}</td>
                    <td>${champ.speed}</td>
                    <td>${champ.max_mana}</td>
                    <td style="font-size: 13px;">${(champ.traits || []).join(', ')}</td>
                    <td style="color: #8e44ad; font-weight: bold;">${skill.type ? skill.type.toUpperCase() : ''}</td>
                    <td>${skillPowerDisplay}</td>
                    <td style="color: #e67e22; font-weight: bold;">${skill.radius ? skill.radius : '-'}</td>
                    <td>${skill.duration ? skill.duration + 's' : '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable(currentPool);

        // 1. CHỨC NĂNG ĐỒNG BỘ TRỰC TIẾP TỪ GOOGLE DRIVE
        const syncBtn = document.getElementById('syncDriveBtn');
        syncBtn.addEventListener('click', async () => {
            syncBtn.disabled = true;
            syncBtn.innerText = '⏳ Đang tải từ Google Drive...';
            syncStatus.innerText = 'Đang đồng bộ dữ liệu...';
            syncStatus.style.color = '#e67e22';

            try {
                const res = await fetch('/api/reload_champions', { method: 'POST' });
                const json = await res.json();
                if (json.status === 'ok') {
                    const champRes = await fetch('/api/champions?reload=1');
                    currentPool = await champRes.json();
                    renderTable(currentPool);
                    syncStatus.innerText = `Đã đồng bộ thành công ${currentPool.length} tướng lúc ${new Date().toLocaleTimeString()}!`;
                    syncStatus.style.color = '#27ae60';
                } else {
                    syncStatus.innerText = `Cảnh báo: ${json.message}`;
                    syncStatus.style.color = '#e74c3c';
                }
            } catch (err) {
                syncStatus.innerText = `Lỗi kết nối: ${err.message}`;
                syncStatus.style.color = '#e74c3c';
            } finally {
                syncBtn.disabled = false;
                syncBtn.innerText = '🔄 ĐỒNG BỘ GOOGLE DRIVE';
            }
        });

        // 2. CHỨC NĂNG XUẤT FILE EXCEL (.CSV) CHUẨN VIỆT NAM
        document.getElementById('exportBtn').addEventListener('click', () => {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";

            csvContent += "Champion Name;Cost;HP;Attack (ATK);Range;Speed;Mana;Traits;Skill Type;Skill Value;Radius;Skill Duration\n";

            currentPool.forEach(champ => {
                const skill = champ.skill || {};

                let skillPower = skill.power || '';
                if (!skillPower && skill.percent) skillPower = skill.percent;

                const row = [
                    `"${champ.name}"`,
                    champ.cost,
                    champ.hp,
                    champ.attack,
                    champ.attack_range,
                    champ.speed,
                    champ.max_mana,
                    `"${(champ.traits || []).join(', ')}"`,
                    skill.type || '',
                    skillPower,
                    skill.radius || '',
                    skill.duration || ''
                ];
                csvContent += row.join(';') + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Champion_Stats_AutoBattler.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
